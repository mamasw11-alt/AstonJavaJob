name: Run Java Homework

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Compile Homework.java
      run: javac src/main/java/com/example/Homework.java
    
    - name: Run Homework
      run: java -cp src/main/java com.example.Homework
